[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-intent-compiler"
version = "1.0.0"
description = "Deterministic Intent Compiler & Typed DAG Execution Planner for Autonomous AI Agents & MCP"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Benni Alencar", email = "bennialencar@gmail.com" }
]
keywords = [
    "intent-compiler",
    "ai-agents",
    "dag-execution",
    "mcp",
    "model-context-protocol",
    "prompt-injection-defense",
    "deterministic-agents",
    "pydantic-v2",
    "langchain-alternative",
    "typed-agents"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: Software Development :: Compilers"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "twine>=4.0.0",
    "build>=1.0.0"
]

[project.scripts]
agent-intent-compiler = "agent_intent_compiler.cli:main"

[project.urls]
Homepage = "https://github.com/BenniAlencar/agent-intent-compiler"
Repository = "https://github.com/BenniAlencar/agent-intent-compiler"
Issues = "https://github.com/BenniAlencar/agent-intent-compiler/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_intent_compiler"]
